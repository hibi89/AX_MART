name: PC CARE synthetic Windows QA
# Explicit dispatch only: first branch push failed before a runner was allocated.
# This is an infrastructure/billing/runner availability blocker, NOT a test pass.
# Avoid automatic retries on every feature commit until CI runner availability is fixed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-care-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: products/pc-care
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse scripts and run offline synthetic PowerShell 5.1 fixtures
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/windows_smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Python source and internal ZIP tests
        shell: pwsh
        run: |
          & python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated QR UI Node tests (mock DOM, no real browser)
        shell: pwsh
        run: |
          & node --test tests/test_qr_ui.cjs tests/test_qr_vendor.cjs tests/test_history_compare.cjs tests/test_history_dom.cjs tests/test_history_signals.cjs tests/test_history_batch.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual internal-only QA ZIP
        shell: pwsh
        run: |
          $qaDir = Join-Path $env:RUNNER_TEMP 'pc-care-qa'
          & python tools/release.py --internal-testing --output $qaDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qaFile = Join-Path $qaDir 'AXMART_PC_CARE_USB_v0.1-alpha_INTERNAL_TEST_ONLY.zip'
          & python tools/release.py --verify $qaFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm only synthetic checks were executed
        shell: pwsh
        run: Write-Host 'Windows parser + synthetic fixtures + Python package tests only. No diagnosis, repair, WinRE, scan, user data or publication.'
